/* Begin PBXShellScriptBuildPhase section */
		1A4E7C092E981E6C00A17D69 /* ShellScript */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			shellPath = /bin/sh;
			shellScript = (
				"# Pre-build Code Quality Checks",
				"# Runs SwiftFormat and SwiftLint before every build",
				"",
				"set -e",
				"",
				"if [ \"$CONFIGURATION\" = \"Debug\" ] || [ \"$SKIP_CODE_QUALITY_CHECKS\" = \"YES\" ]; then",
				"    echo \"⏭️ Skipping pre-build code quality checks\"",
				"    exit 0",
				"fi",
				"",
				"cd \"$SRCROOT\"",
				"",
				"paths=(",
				"    \"\\\"$SRCROOT/AeroSpaceBar\\\"\"",
				"    \"\\\"$SRCROOT/AeroSpaceBarUITests\\\"\"",
				"    \"\\\"$SRCROOT/Packages\\\"\"",
				")",
				"",
				"swiftformat_cmd=\"swiftformat --config \\\"$SRCROOT/.swiftformat\\\" ${paths[@]}\"",
				"swiftlint_cmd=\"swiftlint --config \\\"$SRCROOT/.swiftlint.yaml\\\"\"",
				"",
				"if [[ \"$(uname -m)\" == arm64 ]]; then",
				"    export PATH=\"/opt/homebrew/bin:$PATH\"",
				"fi",
				"",
				"echo \"🔧 Running SwiftFormat (pass 1)...\"",
				"if which swiftformat > /dev/null; then",
				"    eval \"$swiftformat_cmd\"",
				"else",
				"    echo \"⚠️ SwiftFormat not found. Install with: brew install swiftformat\"",
				"    exit 1",
				"fi",
				"",
				"echo \"🔍 Running SwiftLint fix...\"",
				"if which swiftlint > /dev/null; then",
				"    eval \"$swiftlint_cmd --fix\"",
				"else",
				"    echo \"⚠️ SwiftLint not found. Install with: brew install swiftlint\"",
				"    exit 1",
				"fi",
				"",
				"echo \"🔧 Running SwiftFormat (pass 2)...\"",
				"eval \"$swiftformat_cmd\"",
				"",
				"echo \"✅ Running SwiftLint strict check...\"",
				"eval \"$swiftlint_cmd --strict\"",
				"",
				"echo \"✅ Pre-build checks completed successfully\"",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

