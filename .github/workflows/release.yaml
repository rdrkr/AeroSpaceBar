name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history, required for changelog generation

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install dependencies
        run: brew install bash swiftlint swiftformat

      - name: Disable dependency Macro validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Import code signing certificates
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
        run: |
          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATES_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm certificate.p12

          # Set keychain as default
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Report what was actually imported, and fail here rather than midway
          # through the release if the keychain has no usable signing identity.
          # Without this the import step is silent and a missing certificate only
          # surfaces later, during signing.
          #
          # `find-identity -v` lists only valid identities, so an expired
          # certificate shows up as zero even though the import itself succeeded.
          echo "Signing identities available after import:"
          security find-identity -v -p codesigning
          if security find-identity -v -p codesigning | grep -q "0 valid identities found"; then
            # Show invalid identities too: an expired certificate imports fine and
            # only disappears from the `-v` (valid-only) listing, which otherwise
            # makes this look like the import silently did nothing.
            echo "All identities, including invalid/expired ones:"
            security find-identity -p codesigning || true
            echo "::error::CERTIFICATES_P12 imported no *valid* signing identity. If the certificate appears above but not in the valid list, it has expired - re-export the current identity from Keychain Access and update the CERTIFICATES_P12 secret."
            exit 1
          fi

      - name: Checkout homebrew-tap repo
        uses: actions/checkout@v6
        with:
          repository: rdrkr/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: Run automated release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_PATH: homebrew-tap
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          chmod +x ./Scripts/release.sh
          ./Scripts/release.sh --skip-notarize --version ${{ github.event.inputs.version }}
