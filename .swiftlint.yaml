# SwiftLint Configuration for AeroSpaceBar
# https://github.com/realm/SwiftLint

# Disable all rules by default
disabled_rules:
  # Add any rules you want to disable here
  - trailing_whitespace # We'll let SwiftFormat handle this
  - trailing_newline # We'll let SwiftFormat handle this
  - vertical_whitespace # We'll let SwiftFormat handle this
  - vertical_whitespace_between_cases # We'll let SwiftFormat handle this
  - opening_brace # We'll let SwiftFormat handle brace spacing
  - identifier_name

# Enable specific rules
opt_in_rules:
  #  - accessibility_label_for_image
  #  - accessibility_trait_for_button
  - anonymous_argument_in_multiline_closure
  - array_init
  - async_without_await
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - expiring_todo
  #  - explicit_acl
  - explicit_init
  #  - explicit_top_level_acl
  #  - explicit_type_interface
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  #  - file_types_order
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - ibinspectable_in_extension
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - let_var_whitespace
  - literal_expression_end_indentation
  #  - local_doc_comment
  - lower_acl_than_parent
  #  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - no_grouping_extension
  #  - no_magic_numbers
  - non_overridable_class_declaration
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - period_spacing
  - prefer_condition_list
  - prefer_key_path
  - prefer_nimble
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - private_subject
  - private_swiftui_state
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_nil_coalescing
  - redundant_self
  - redundant_type_annotation
  - required_enum_case
  - return_value_from_void_function
  - self_binding
  - shorthand_argument
  - shorthand_optional_binding
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - strong_iboutlet
  - superfluous_else
  - test_case_accessibility
  - toggle_bool
  #  - type_contents_order
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_parameter
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

# Configure rules
analyzer_rules:
  - capture_variable
  - explicit_self
  - typesafe_array_init
  - unused_declaration
  - unused_import

# Custom rule configurations
capture_variable:
  severity: error

explicit_self:
  severity: error

typesafe_array_init:
  severity: error

unused_declaration:
  severity: error

unused_import:
  severity: error

line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 200
  error: 200

function_parameter_count:
  warning: 6
  error: 8

type_body_length:
  warning: 1000
  error: 1000

file_length:
  warning: 1500
  error: 1500

cyclomatic_complexity:
  warning: 10
  error: 20

large_tuple:
  warning: 3
  error: 4

type_name:
  max_length:
    warning: 60
    error: 60

# Exclude files and directories
excluded:
  - .build
  - .claude
  - .generated.swift
  - build
  - Carthage
  - DerivedData
  - Pods
  - Packages/Data/.build
  - Packages/Domain/.build
  - Packages/Presentation/.build
  - "**/Secrets.swift" # Auto-generated secrets file

# Include only specific file types
included:
  - ./**/*.swift
